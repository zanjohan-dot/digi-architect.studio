<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Zahrif Adam | Creative Director, Digital Media</title>

    <meta
      name="description"
      content="Digital Name Card for Zahrif Adam, Creative Director, Digital Media at The Digital Systems Architect."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050914" />

    <link rel="canonical" href="https://digi-architect.studio/adam/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- WhatsApp / Facebook / LinkedIn preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Digital Systems Architect" />
    <meta
      property="og:title"
      content="Zahrif Adam | Creative Director, Digital Media"
    />
    <meta
      property="og:description"
      content="Digital Name Card for Zahrif Adam, Creative Director, Digital Media at The Digital Systems Architect."
    />
    <meta property="og:url" content="https://digi-architect.studio/adam/" />
    <meta
      property="og:image"
      content="https://digi-architect.studio/adam/assets/og-adam-whatsapp-v6.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://digi-architect.studio/adam/assets/og-adam-whatsapp-v6.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta
      property="og:image:alt"
      content="Zahrif Adam digital name card preview"
    />

    <!-- Twitter / X preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Zahrif Adam | Creative Director, Digital Media"
    />
    <meta
      name="twitter:description"
      content="Digital Name Card for Zahrif Adam, Creative Director, Digital Media at The Digital Systems Architect."
    />
    <meta
      name="twitter:image"
      content="https://digi-architect.studio/adam/assets/og-adam-whatsapp-v6.png"
    />

    <!-- Fonts and icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="styles.css" />
    <script src="adam-card.js" defer></script>
  </head>

  <body>
    <main class="card-page" aria-labelledby="card-title">
      <article class="identity-card" aria-label="Digital name card for Zahrif Adam">
        <header class="card-top">
          <a
            class="brand-logo"
            href="https://digi-architect.studio"
            target="_blank"
            rel="noopener"
            aria-label="Visit The Digital Systems Architect website"
          >
            <img
              src="assets/company-logo.png"
              alt="The Digital Systems Architect"
            />
          </a>

          <div class="utility-actions" aria-label="Card actions">
            <button
              class="top-icon-button"
              type="button"
              data-save-contact
              aria-label="Save Zahrif Adam contact"
            >
              <i class="bi bi-download" aria-hidden="true"></i>
            </button>

            <button
              class="top-icon-button"
              type="button"
              data-copy-link
              aria-label="Copy digital card link"
            >
              <i class="bi bi-copy" aria-hidden="true"></i>
            </button>
          </div>
        </header>

        <section class="profile-block">
          <div
            class="profile-photo"
            style="display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg, rgba(103,209,255,0.16), rgba(255,255,255,0.05));font-weight:800;font-size:1.5rem;color:var(--accent);"
            role="img"
            aria-label="Zahrif Adam"
          >ZA</div>

          <h1 id="card-title">Zahrif Adam</h1>

        <p class="role">
  <span>Creative Director</span>
  <span>Digital Media</span>
</p>

          <p class="tagline">
            Leading creative direction across visual and digital storytelling.
          </p>
        </section>

        <section class="qr-section" aria-label="Digital card QR code">
          <button
            class="qr-button"
            type="button"
            data-open-qr
            aria-label="Open enlarged QR code"
          >
            <img
              class="qr-image"
              src="assets/card-qr.png"
              alt="QR code for Zahrif Adam digital card"
            />
          </button>

          <a
            class="card-url"
            href="https://digi-architect.studio/adam/"
            data-card-url
          >
            digi-architect.studio/adam
          </a>
        </section>

        <nav class="contact-row" aria-label="Contact links">
          <a
            class="social-button"
            href="https://wa.me/6589878714"
            target="_blank"
            rel="noopener"
            aria-label="Open WhatsApp"
            data-whatsapp-link
          >
            <i class="bi bi-whatsapp" aria-hidden="true"></i>
          </a>

          <a
            class="social-button"
            href="mailto:adam@digi-architect.studio"
            aria-label="Email Zahrif Adam"
            data-email-link
          >
            <i class="bi bi-envelope" aria-hidden="true"></i>
          </a>

          <a
            class="social-button"
            href="https://www.linkedin.com/company/the-digital-systems-architect"
            target="_blank"
            rel="noopener"
            aria-label="Open The Digital Systems Architect LinkedIn company page"
            data-linkedin-link
          >
            <i class="bi bi-linkedin" aria-hidden="true"></i>
          </a>

          <button
            class="social-button"
            type="button"
            data-open-instagram
            aria-label="Open Muslim Friendly SG Instagram QR code"
          >
            <i class="bi bi-instagram" aria-hidden="true"></i>
          </button>

          <a
            class="social-button"
            href="https://www.facebook.com/people/muslimfriendlysg/61591905841478/"
            target="_blank"
            rel="noopener"
            aria-label="Open Muslim Friendly SG Facebook"
            data-facebook-link
          >
            <i class="bi bi-facebook" aria-hidden="true"></i>
          </a>

          <a
            class="social-button"
            href="https://www.youtube.com/@muslim.friendly.studio"
            target="_blank"
            rel="noopener"
            aria-label="Open Muslim Friendly SG YouTube"
            data-youtube-link
          >
            <i class="bi bi-youtube" aria-hidden="true"></i>
          </a>

          <a
            class="social-button"
            href="https://digi-architect.studio/muslim-friendly-directory#hero"
            target="_blank"
            rel="noopener"
            aria-label="Open Muslim Friendly Directory"
            data-directory-link
          >
            <i class="bi bi-journal-bookmark" aria-hidden="true"></i>
          </a>
        </nav>

        <a
          class="site-link"
          href="https://digi-architect.studio/muslim-friendly-advisory#showcase"
          target="_blank"
          rel="noopener"
          data-website-link
        >
          digi-architect.studio/muslim-friendly-advisory
        </a>
      </article>
    </main>

    <dialog class="modal" data-qr-modal aria-labelledby="qr-modal-title">
      <div class="modal-card">
        <header class="modal-top">
          <h2 id="qr-modal-title">Digital card</h2>

          <button
            class="modal-close"
            type="button"
            data-close-qr
            aria-label="Close QR code"
          >
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </header>

        <div class="modal-qr">
          <img
            class="modal-qr-image"
            src="assets/card-qr.png"
            alt="Large QR code for Zahrif Adam digital card"
          />
        </div>

        <a
          class="modal-url"
          href="https://digi-architect.studio/adam/"
          data-modal-card-url
        >
          digi-architect.studio/adam
        </a>

        <button class="modal-copy" type="button" data-modal-copy-link>
          Copy link
        </button>
      </div>
    </dialog>

    <dialog
      class="modal"
      data-instagram-modal
      aria-labelledby="instagram-modal-title"
    >
      <div class="modal-card">
        <header class="modal-top">
          <h2 id="instagram-modal-title">Instagram</h2>

          <button
            class="modal-close"
            type="button"
            data-close-instagram
            aria-label="Close Instagram QR code"
          >
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </header>

        <img
          class="instagram-qr"
          src="assets/instagram-qr.png"
          alt="Instagram QR code for Muslim Friendly SG"
        />

        <a
          class="modal-url"
          href="https://www.instagram.com/muslim.friendly.sg/"
          target="_blank"
          rel="noopener"
          data-instagram-link
        >
          instagram.com/muslim.friendly.sg
        </a>

        <button class="modal-copy" type="button" data-copy-instagram>
          Copy Instagram link
        </button>
      </div>
    </dialog>

    <p class="toast" role="status" aria-live="polite" data-toast hidden></p>
  </body>
</html>
