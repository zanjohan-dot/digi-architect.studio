name: Directory international research extract

# Read-only OpenStreetMap research for new countries. Runs when the research
# script changes on the international branch, and commits the extract back to
# that branch. Never touches the live workbooks or main.
on:
  push:
    branches: [directory-international]
    paths:
      - "_directory-sync/research_osm.py"
      - ".github/workflows/directory-research.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r _directory-sync/requirements.txt
      - name: Extract Malaysia and Japan
        run: |
          set -o pipefail
          python _directory-sync/research_osm.py MY JP 2>&1 | tee research.log
      - name: Commit extract
        run: |
          git config user.name "directory-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp research.log _directory-sync/research/extract.log
          git add _directory-sync/research
          git diff --cached --quiet && exit 0
          git commit -m "Research extract: OpenStreetMap Malaysia and Japan $(date -u +%Y-%m-%d)"
          git push origin HEAD:${GITHUB_REF_NAME}
