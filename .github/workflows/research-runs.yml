name: Research runs (scratch branch)
on:
  push:
    branches: [directory-research-runs]
    paths: ["_runs/request.json"]
permissions:
  contents: write
concurrency:
  group: research-runs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python _runs/run.py 2>&1 | tee _runs/out-last.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "directory-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _runs
          git diff --cached --quiet && exit 0
          git commit -m "Research run output"
          git pull --rebase --quiet origin directory-research-runs
          git push origin HEAD:directory-research-runs
