<title>Page not found | The Digital Systems Architect</title>
<script>
/* Old and trailing-slash addresses that should reach a live page. */
(function () {
  var moved = {
    "/muslim-friendly-directory/": "/muslim-friendly-directory",
    "/muslim-friendly-advisory/": "/muslim-friendly-advisory",
    "/halal-muslim-friendly-singapore": "/muslim-friendly-advisory",

    "/muslim-friendly-directory/index.html": "/muslim-friendly-directory",
    "/muslim-friendly-advisory/index.html": "/muslim-friendly-advisory"
  };
  var path = location.pathname.toLowerCase();
  var target = moved[path];
  if (target) location.replace(target + location.search + location.hash);
})();
</script>
